name: 3D contribution village

on:
  schedule:
    - cron: "0 18 * * *"   # daily
  workflow_dispatch:        # run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-contribution
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # PROFILE_TOKEN is optional: a personal access token lets the village count private contributions.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "Update 3D contribution village"; then
            git pull --rebase origin main
            git push
          fi
